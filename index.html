<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auth Callback</title>
<style>
  :root { --bg:#f6f7f9; --card:#ffffff; --text:#1a1d21; --muted:#6b7280; --accent:#0f766e; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#101214; --card:#1a1d21; --text:#e8eaed; --muted:#9aa0a6; --accent:#34d399; --border:#2d3136; }
  }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
         display:flex; min-height:100vh; align-items:center; justify-content:center; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px; max-width:560px; width:100%; }
  h1 { font-size:18px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 16px; font-size:14px; }
  code { display:block; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px;
         word-break:break-all; font-size:14px; margin-bottom:12px; }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer; }
  .none { color:var(--muted); }
</style>
</head>
<body>
<div class="card">
  <h1>Код авторизации</h1>
  <div id="content"><p class="none">В адресе нет auth_code. Эта страница — точка возврата после «Confirm»; код появится здесь автоматически.</p></div>
</div>
<script>
  var code = new URLSearchParams(location.search).get('auth_code');
  if (code) {
    var el = document.getElementById('content');
    el.innerHTML = '<p>Одноразовый, живёт ~1 час — сразу передай Claude.</p><code id="c"></code><button id="b">Скопировать</button>';
    document.getElementById('c').textContent = code;
    document.getElementById('b').onclick = function () {
      try { navigator.clipboard.writeText(code); this.textContent = 'Скопировано ✓'; } catch (e) {}
    };
  }
</script>
</body>
</html>
